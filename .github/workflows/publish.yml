name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # for trusted publishing

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PDM
        run: pip install pdm

      - name: Install dependencies
        run: pdm install

      - name: Set version from tag
        # Strip the leading "v" from the tag name (v1.2.3 → 1.2.3) and write
        # it into pyproject.toml. PDM's dynamic version field then carries this
        # through to the built wheel/sdist and to importlib.metadata at runtime,
        # so docs/conf.py picks it up automatically.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          pdm run python -c "
          import re, pathlib
          p = pathlib.Path('pyproject.toml')
          p.write_text(re.sub(r'(?m)^version = \".*\"', 'version = \"${VERSION}\"', p.read_text()))
          "

      - name: Run tests before publishing
        run: pdm run pytest tests/ --ignore=tests/providers -q

      - name: Build
        run: pdm build

      - name: Publish to PyPI
        run: pdm publish --no-build
  docs:
    name: Publish docs to Read the Docs
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Trigger Read the Docs build (stable)
        env:
          RTD_TOKEN: ${{ secrets.RTD_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Token $RTD_TOKEN" \
            "https://readthedocs.org/api/v3/projects/nextorm/versions/stable/builds/"

      - name: Trigger Read the Docs build (latest)
        env:
          RTD_TOKEN: ${{ secrets.RTD_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Token $RTD_TOKEN" \
            "https://readthedocs.org/api/v3/projects/nextorm/versions/latest/builds/"

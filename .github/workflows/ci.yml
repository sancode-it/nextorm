name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15", "pypy-3.12"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PDM
        run: pip install pdm

      - name: Install dependencies
        run: pdm install

      - name: Format check
        run: pdm run ruff format --check

      - name: Lint
        run: pdm run ruff check

      - name: Type check (CPython)
        if: matrix.python-version != 'pypy-3.12'
        run: pdm typecheck

      - name: Type check (PyPy)
        if: matrix.python-version == 'pypy-3.12'
        run: pdm pyright

      - name: Test (SQLite only — no DB server in CI)
        run: pdm run pytest tests/ --ignore=tests/providers -q

  docs:
    name: Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install PDM
        run: pip install pdm

      - name: Install dependencies
        run: pdm install

      - name: Documentation doctest (fail on warning)
        run: pdm run sphinx-build -b doctest -W --keep-going docs/ docs/_build/doctest

      - name: Build docs (fail on warning)
        run: pdm run sphinx-build -b html -W --keep-going docs/ docs/_build/html

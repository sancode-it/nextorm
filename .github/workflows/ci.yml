name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15", "pypy-3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PDM
        run: pip install pdm

      - name: Install dependencies
        run: pdm install

      - name: Lint
        run: pdm run ruff check nextorm/ tests/

      - name: Type check
        run: pdm run pyright nextorm/

      - name: Test (SQLite only — no DB server in CI)
        run: pdm run pytest tests/ --ignore=tests/providers -q

  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install PDM
        run: pip install pdm

      - name: Install dependencies
        run: pdm install

      - name: Documentation doctest (fail on warning)
        run: pdm run sphinx-build -b doctest -W --keep-going docs/ docs/_build/doctest

      - name: Build docs (fail on warning)
        run: pdm run sphinx-build -b html -W --keep-going docs/ docs/_build/html
